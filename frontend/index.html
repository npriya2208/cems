<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CEMS — College Event Management System</title>
    <meta name="description" content="College Event Management System — browse and register for campus events, manage event logistics, and track attendance." />

    <link rel="stylesheet" href="/styles/index.css" />

    <!-- Google Identity Services (Sign in with Google) -->
    <!-- The script is loaded async/defer — google-auth.js retries until it's ready -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Replace with your OAuth Client ID from Google Cloud Console.
         Must match GOOGLE_CLIENT_ID in backend/auth.py and frontend/js/google-auth.js -->
    <meta name="google-signin-client_id" content="YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <header class="navbar" id="navbar" role="banner">
        <!-- Rendered dynamically by router.js renderNavbar() -->
      </header>

      <main class="app-main" id="app-root" role="main">
        <!-- Router dynamically renders views here -->
      </main>

      <footer class="footer-note" role="contentinfo">
        College Event Management System — built from the CEMS SRS &amp; UML design
      </footer>
    </div>

    <!-- router.js is the single entry point; it imports api.js and all views as ES modules -->
    <script src="/js/router.js" type="module"></script>
  </body>
</html>
